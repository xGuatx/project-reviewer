[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-reviewer"
version = "1.0.0"
description = "CLI tool for reviewing, classifying, and preparing projects for publication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Project Reviewer Team"}
]
keywords = ["cli", "project-review", "security", "cleanup", "github", "credentials", "scanning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
project-reviewer = "project_reviewer.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/project-reviewer"
Repository = "https://github.com/YOUR_USERNAME/project-reviewer"
Issues = "https://github.com/YOUR_USERNAME/project-reviewer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_reviewer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
